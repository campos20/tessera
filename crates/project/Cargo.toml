[package]
name = "project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Tessera project model: serde schema, versioning and migrations. Shared by both editions."

[features]
default = []
# Generate TypeScript bindings into packages/schema.
ts = ["dep:ts-rs", "tune/ts"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = { version = "12.0.1", optional = true }
tune = { version = "0.1.0", path = "../tune" }
