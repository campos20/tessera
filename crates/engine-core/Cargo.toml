[package]
name = "engine-core"
description = "Platform-agnostic Tessera audio engine: graph, transport, DSP. No I/O, no threads."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Serde derives for the command/event protocol (used by the Tauri IPC layer).
serde = ["dep:serde"]
# Generate TypeScript bindings into packages/schema (`cargo test -p engine-core --features ts`).
ts = ["serde", "dep:ts-rs"]

[dependencies]
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
ts-rs = { version = "12.0.1", optional = true }

[lints]
workspace = true

[dev-dependencies]
assert_no_alloc = "1.1.2"
hound = "3.5.1"
rtrb = "0.4.1"
serde_json = "1.0.154"
