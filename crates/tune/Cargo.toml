[package]
name = "tune"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Tune: monophonic pitch analysis, note segmentation, key/tempo estimation and pitch/time rendering."

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[features]
default = []
# Generate TypeScript bindings into packages/schema.
ts = ["dep:ts-rs"]

[dev-dependencies]
hound = "3.5.1"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
